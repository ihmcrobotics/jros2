name: Build natives

# Rebuilds the bundled native libraries and commits them to the branch the workflow runs on.
#   Linux (glibc 2.31 baseline), musl and Android: scripts/docker/build-natives.sh (Docker, pinned + checksummed sources,
#     Fast-DDS with DDS-Security and a private static OpenSSL, built-in verification).
#   macOS and Windows: scripts/cppbuild.bash (DDS-Security is an opt-in input there).
# Both apply jros2's Fast-DDS patches (src/native/fastdds-patches/*.patch) to the pinned Fast-DDS sources.
# Every platform directory is replaced completely, so stale files from older releases are removed.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and commit
        type: choice
        options:
          - all
          - linux
          - android
          - macos
          - windows
        default: all
      macos_windows_security:
        description: Build the macOS/Windows natives with DDS-Security (static OpenSSL; experimental, not exercised by CI tests)
        type: boolean
        default: false
      musl_arm64_runner:
        description: Runner for linux-musl-arm64 (ubuntu-24.04-arm builds natively; ubuntu-24.04 emulates arm64 with qemu, about 10x slower)
        type: choice
        options:
          - ubuntu-24.04-arm
          - ubuntu-24.04
        default: ubuntu-24.04-arm

# Read-only by default: the build jobs run third-party build systems with the checkout (and its token) mounted.
# Only the commit job gets write access.
permissions:
  contents: read

concurrency:
  group: build-natives-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.plan.outputs.docker }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - name: Select platforms
        id: plan
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          MUSL_ARM64_RUNNER: ${{ inputs.musl_arm64_runner }}
        run: |
          set -euo pipefail
          entry() { # platform runner qemu
            jq -cn --arg p "$1" --arg r "$2" --argjson q "$3" '{platform: $p, runner: $r, qemu: $q}'
          }
          qemu=false
          [[ "$MUSL_ARM64_RUNNER" == *-arm ]] || qemu=true
          linux=(
            "$(entry linux-x86_64 ubuntu-24.04 false)"
            "$(entry linux-arm64 ubuntu-24.04 false)"
            "$(entry linux-armhf ubuntu-24.04 false)"
            "$(entry linux-riscv64 ubuntu-24.04 false)"
            "$(entry linux-musl-x86_64 ubuntu-24.04 false)"
            "$(entry linux-musl-arm64 "$MUSL_ARM64_RUNNER" "$qemu")"
          )
          android=(
            "$(entry android-arm64-v8a ubuntu-24.04 false)"
            "$(entry android-armeabi-v7a ubuntu-24.04 false)"
            "$(entry android-x86_64 ubuntu-24.04 false)"
          )
          macos='[{"platform":"macos-arm64","arch":"ARM64"},{"platform":"macos-x86_64","arch":"X86_64"}]'
          windows='[{"platform":"windows-x86_64","msvc_arch":"x64","arm64":"0"},{"platform":"windows-arm64","msvc_arch":"amd64_arm64","arm64":"1"}]'
          docker=()
          case "$PLATFORMS" in
            all) docker=("${linux[@]}" "${android[@]}") ;;
            linux) docker=("${linux[@]}"); macos='[]'; windows='[]' ;;
            android) docker=("${android[@]}"); macos='[]'; windows='[]' ;;
            macos) windows='[]' ;;
            windows) macos='[]' ;;
          esac
          if [ ${#docker[@]} -eq 0 ]; then docker_json='[]'; else docker_json=$(printf '%s\n' "${docker[@]}" | jq -cs .); fi
          echo "docker=$docker_json" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
          echo "windows=$windows" >> "$GITHUB_OUTPUT"
          echo "docker: $docker_json"; echo "macos: $macos"; echo "windows: $windows"

  # Proves that verify-natives.sh (the gate of every Linux/Android build below and of the commit job) still rejects
  # each defect it exists to catch, using tiny fixture libraries built with the runner's compiler.
  verifier-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Self-test verify-natives.sh
        shell: bash
        run: bash scripts/docker/test-verify-natives.sh

  # Linux (glibc + musl, incl. riscv64) and Android: reproducible Docker builds with built-in verification.
  build-natives-docker:
    needs: [plan, verifier-selftest]
    if: needs.plan.outputs.docker != '[]'
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.docker) }}
    env:
      # Work/cache root (sources, per-platform dependency cache, NDK) and output root, outside the repository mount.
      JROS2_WORK_ROOT: /home/runner/jros2-natives-work
      OUT_DIR: /home/runner/jros2-natives-out
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU (emulated arm64)
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.JROS2_WORK_ROOT }}/_sources
            ${{ env.JROS2_WORK_ROOT }}/${{ matrix.platform }}/deps
          key: natives-deps-${{ matrix.platform }}-${{ hashFiles('scripts/native-versions.env', 'scripts/docker/Dockerfile.*', 'scripts/docker/env.sh', 'scripts/docker/deps.sh', 'src/native/fastdds-patches/*.patch') }}

      - name: Restore Android NDK
        if: startsWith(matrix.platform, 'android-')
        uses: actions/cache@v4
        with:
          path: ${{ env.JROS2_WORK_ROOT }}/_cache/android-ndk-r30
          key: android-ndk-r30-30.0.16248370

      - name: Build ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          JOBS=$(nproc) bash scripts/docker/build-natives.sh "${{ matrix.platform }}" . "$OUT_DIR"

      - name: Re-verify with the runner's readelf
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/docker/verify-natives.sh "${{ matrix.platform }}" "$OUT_DIR/${{ matrix.platform }}" \
            src/main/java/us/ihmc/fastddsjava/natives/fastddsjava.java

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.platform }}
          path: ${{ env.OUT_DIR }}/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  build-natives-windows:
    needs: plan
    if: needs.plan.outputs.windows != '[]'
    name: build ${{ matrix.platform }}
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022
          arch: ${{ matrix.msvc_arch }}
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile native library (${{ matrix.platform }})
        shell: bash
        env:
          WINDOWS_COMPILE_ARM64: ${{ matrix.arm64 }}
          JROS2_SECURITY: ${{ inputs.macos_windows_security && 'ON' || 'OFF' }}
        run: |
          set -euo pipefail
          bash scripts/cppbuild.bash
      - name: Stage and verify Windows native libraries
        shell: bash
        run: |
          set -euo pipefail
          DEST="src/main/resources/fastddsjava/native/${{ matrix.platform }}"
          ls -la "$DEST"
          for f in fastcdr-2.3.dll fastdds-3.6.dll jnifastddsjava.dll natives.list; do
            test -f "$DEST/$f" || { echo "Missing $DEST/$f"; exit 1; }
          done
          test "$(tail -n 1 "$DEST/natives.list" | tr -d '\r')" = jnifastddsjava.dll || { echo "natives.list must end with the JNI library"; exit 1; }
          # Reject stale JNI binaries linked against another Fast-DDS version. dumpbin parses ARM64 PE, MinGW objdump does not.
          deps=""
          if command -v dumpbin.exe >/dev/null 2>&1; then
            deps=$(MSYS_NO_PATHCONV=1 dumpbin.exe /DEPENDENTS "$DEST/jnifastddsjava.dll" 2>/dev/null || true)
          elif command -v objdump >/dev/null 2>&1; then
            deps=$(objdump -p "$DEST/jnifastddsjava.dll" 2>/dev/null | grep -i 'DLL Name' || true)
          fi
          echo "$deps"
          echo "$deps" | grep -qi 'fastdds-3\.6\.dll' || { echo "jnifastddsjava.dll does not import fastdds-3.6.dll"; exit 1; }
          mkdir -p "artifact/${{ matrix.platform }}"
          cp -a "$DEST/." "artifact/${{ matrix.platform }}/"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.platform }}
          path: artifact/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  build-natives-macos:
    needs: plan
    if: needs.plan.outputs.macos != '[]'
    name: build ${{ matrix.platform }}
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.macos) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile native library (${{ matrix.platform }})
        env:
          JROS2_SECURITY: ${{ inputs.macos_windows_security && 'ON' || 'OFF' }}
        run: |
          set -euo pipefail
          # cppbuild.bash verifies architecture, minos (MACOS_DEPLOYMENT_TARGET), LC_RPATH and dependencies.
          MAC_COMPILE_${{ matrix.arch }}=1 bash scripts/cppbuild.bash
      - name: Stage macOS native libraries
        run: |
          set -euo pipefail
          DEST="src/main/resources/fastddsjava/native/${{ matrix.platform }}"
          ls -la "$DEST"
          test -f "$DEST/natives.list"
          while IFS= read -r f; do
            test -f "$DEST/$f" || { echo "natives.list names missing $f"; exit 1; }
            otool -L "$DEST/$f"
          done < "$DEST/natives.list"
          test "$(tail -n 1 "$DEST/natives.list")" = libjnifastddsjava.dylib
          mkdir -p "artifact/${{ matrix.platform }}"
          cp -a "$DEST/." "artifact/${{ matrix.platform }}/"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.platform }}
          path: artifact/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 7

  commit-natives:
    needs: [plan, verifier-selftest, build-natives-docker, build-natives-windows, build-natives-macos]
    # Commit only when every requested build succeeded (skipped jobs are fine).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: natives-*
          merge-multiple: false

      - name: Install artifacts into the repository
        shell: bash
        run: |
          set -euo pipefail
          find artifacts -type f | sort
          : > installed-dirs.txt
          for a in artifacts/natives-*; do
            platform=${a#artifacts/natives-}
            case "$platform" in
              android-*) dest="android/src/main/jniLibs/${platform#android-}" ;;
              *) dest="src/main/resources/fastddsjava/native/$platform" ;;
            esac
            [ -n "$(ls -A "$a")" ] || { echo "empty artifact $a"; exit 1; }
            # Replace the whole directory: removes stale libraries of older releases and renamed files.
            mkdir -p "$dest"
            find "$dest" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "$a/." "$dest/"
            echo "$platform $dest" >> installed-dirs.txt
            echo "Installed $platform into $dest:"; ls -la "$dest"
          done

      - name: Verify installed native libraries
        shell: bash
        run: |
          set -euo pipefail
          FAIL=0
          while read -r platform dest; do
            case "$platform" in
              linux-* | android-*)
                bash scripts/docker/verify-natives.sh "$platform" "$dest" \
                  src/main/java/us/ihmc/fastddsjava/natives/fastddsjava.java || FAIL=1 ;;
              macos-*)
                arch=${platform#macos-}; [ "$arch" = x86_64 ] || arch=arm64
                while IFS= read -r f; do
                  info=$(file -b "$dest/$f")
                  echo "$dest/$f: $info"
                  { echo "$info" | grep -q 'Mach-O 64-bit' && echo "$info" | grep -qw "$arch"; } || { echo "WRONG ARCH: $dest/$f"; FAIL=1; }
                done < "$dest/natives.list" ;;
              windows-*)
                pattern='x86-64'; [ "$platform" = windows-arm64 ] && pattern='Aarch64|ARM64|aarch64'
                while IFS= read -r f; do
                  f=${f%$'\r'}
                  info=$(file -b "$dest/$f")
                  echo "$dest/$f: $info"
                  echo "$info" | grep -Eq "$pattern" || { echo "WRONG ARCH: $dest/$f"; FAIL=1; }
                done < "$dest/natives.list" ;;
            esac
          done < installed-dirs.txt
          [ $FAIL = 0 ] || { echo "Native library verification failed."; exit 1; }
          echo "All installed native libraries verified."

      - name: Commit native libraries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ihmc-rosie"
          git config user.email "rosie@ihmc.us"
          while read -r platform dest; do git add -A "$dest"; done < installed-dirs.txt
          rm -f installed-dirs.txt
          git status --short
          if git diff --staged --quiet; then
            echo "No native library changes to commit."
            exit 0
          fi
          git commit -m "Rebuild native libraries (Fast-DDS 3.6.2): ${{ inputs.platforms }}"
          # Rebase onto the latest branch tip in case other commits landed during the build.
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
