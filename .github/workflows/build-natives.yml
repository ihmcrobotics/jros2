  build-natives-macos:
    runs-on: macos-13
#    needs: build-natives-windows
    strategy:
      matrix:
        platform: [arm64, x86_64]
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - name: Pull repo
        run: |
          git reset --hard
          git pull
      - name: Setup dependencies
        run: |
          NONINTERACTIVE=1 brew uninstall openssl
          NONINTERACTIVE=1 brew cleanup
          sudo rm -rf /usr/local/Cellar/openssl@3/3.5.1
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile native library (arm64)
        if: matrix.platform == 'arm64'
        run: |
          MAC_COMPILE_ARM64=1 bash cppbuild.bash
      - name: Compile native library (x86_64)
        if: matrix.platform == 'x86_64'
        run: |
          bash cppbuild.bash
      - name: Commit native libraries
        uses: EndBug/add-and-commit@v9
        with:
          add: '*.dylib' # Only commit generated java from Linux
          author_name: ihmc-rosie
          author_email: rosie@ihmc.us
          message: 'Rebuild natives for macOS'
          push: true
