name: Build natives

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-natives-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [arm64, armhf, x86_64]
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential crossbuild-essential-arm64 crossbuild-essential-armhf git curl wget unzip openjdk-17-jdk
          # Install newer version of cmake
          wget https://github.com/Kitware/CMake/releases/download/v4.0.2/cmake-4.0.2-linux-x86_64.tar.gz
          tar -xzvf cmake-4.0.2-linux-x86_64.tar.gz
          sudo mv cmake-4.0.2-linux-x86_64 /opt/cmake-4.0.2
          rm -rf cmake-4.0.2-linux-x86_64.tar.gz

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile native library (arm64)
        if: matrix.platform == 'arm64'
        run: |
          PATH=/opt/cmake-4.0.2/bin:$PATH bash build-linux-arm64.bash

      - name: Compile native library (armhf)
        if: matrix.platform == 'armhf'
        run: |
          PATH=/opt/cmake-4.0.2/bin:$PATH bash build-linux-armhf.bash

      - name: Compile native library (x86_64)
        if: matrix.platform == 'x86_64'
        run: |
          PATH=/opt/cmake-4.0.2/bin:$PATH bash build-linux-x86_64.bash

      - name: Stage Linux native libraries
        run: |
          mkdir -p "artifact/linux-${{ matrix.platform }}"
          cp -a "src/main/resources/fastddsjava/native/linux-${{ matrix.platform }}/." "artifact/linux-${{ matrix.platform }}/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natives-linux-${{ matrix.platform }}
          path: artifact/linux-${{ matrix.platform }}/
          retention-days: 1

  build-natives-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile native library
        run: |
          bash.exe cppbuild.bash
      - name: Stage Windows native libraries
        shell: bash
        run: |
          mkdir -p artifact/windows-x86_64
          cp -a src/main/resources/fastddsjava/native/windows-x86_64/. artifact/windows-x86_64/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natives-windows
          path: artifact/windows-x86_64/
          retention-days: 1

  build-natives-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [arm64-v8a, x86_64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential git curl wget unzip openjdk-17-jdk
          # Install newer version of cmake
          wget https://github.com/Kitware/CMake/releases/download/v4.0.2/cmake-4.0.2-linux-x86_64.tar.gz
          tar -xzvf cmake-4.0.2-linux-x86_64.tar.gz
          sudo mv cmake-4.0.2-linux-x86_64 /opt/cmake-4.0.2
          rm -rf cmake-4.0.2-linux-x86_64.tar.gz

      - name: Setup Android NDK
        run: |
          # Download and install Android NDK r27c (latest stable available for direct download)
          wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          sudo mv android-ndk-r27c /opt/android-ndk
          echo "ANDROID_NDK=/opt/android-ndk" >> $GITHUB_ENV

      - name: Compile native library (arm64-v8a)
        if: matrix.platform == 'arm64-v8a'
        run: |
          PATH=/opt/cmake-4.0.2/bin:$PATH bash build-android-arm64.bash

      - name: Compile native library (x86_64)
        if: matrix.platform == 'x86_64'
        run: |
          PATH=/opt/cmake-4.0.2/bin:$PATH bash build-android-x86_64.bash

      - name: Stage Android native libraries
        run: |
          mkdir -p "artifact/${{ matrix.platform }}"
          cp -a "android/src/main/jniLibs/${{ matrix.platform }}/." "artifact/${{ matrix.platform }}/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natives-android-${{ matrix.platform }}
          path: artifact/${{ matrix.platform }}/
          retention-days: 1

  build-natives-macos:
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile native library (${{ matrix.platform }})
        run: |
          MAC_COMPILE_${{ matrix.platform == 'arm64' && 'ARM64' || 'X86_64' }}=1 bash cppbuild.bash
      - name: Stage macOS native libraries
        run: |
          mkdir -p "artifact/macos-${{ matrix.platform }}"
          cp -a "src/main/resources/fastddsjava/native/macos-${{ matrix.platform }}/." "artifact/macos-${{ matrix.platform }}/"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natives-macos-${{ matrix.platform }}
          path: artifact/macos-${{ matrix.platform }}/
          retention-days: 1

  commit-all-natives:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [build-natives-linux, build-natives-windows, build-natives-android, build-natives-macos]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "Listing artifacts directory structure:"
          find artifacts -type f

      - name: Copy artifacts to repository
        run: |
          set -euo pipefail

          copy_artifact_dir() {
            local src="$1"
            local dest="$2"
            if [ ! -d "$src" ]; then
              echo "Missing artifact directory: $src"
              exit 1
            fi
            mkdir -p "$dest"
            cp -a "$src/." "$dest/"
          }

          # Each upload-artifact job places library files at the artifact root
          # (e.g. artifacts/natives-linux-arm64/*.so), not in a nested platform folder.
          copy_artifact_dir artifacts/natives-linux-arm64 src/main/resources/fastddsjava/native/linux-arm64
          copy_artifact_dir artifacts/natives-linux-armhf src/main/resources/fastddsjava/native/linux-armhf
          copy_artifact_dir artifacts/natives-linux-x86_64 src/main/resources/fastddsjava/native/linux-x86_64

          # Windows
          copy_artifact_dir artifacts/natives-windows src/main/resources/fastddsjava/native/windows-x86_64

          # Android
          copy_artifact_dir artifacts/natives-android-arm64-v8a android/src/main/jniLibs/arm64-v8a
          copy_artifact_dir artifacts/natives-android-x86_64 android/src/main/jniLibs/x86_64

          # macOS
          copy_artifact_dir artifacts/natives-macos-arm64 src/main/resources/fastddsjava/native/macos-arm64
          copy_artifact_dir artifacts/natives-macos-x86_64 src/main/resources/fastddsjava/native/macos-x86_64

      - name: Verify native library architectures
        run: |
          FAIL=0
          BASE="src/main/resources/fastddsjava/native"
          ANDROID_BASE="android/src/main/jniLibs"

          check_file() {
            local path="$1"
            local arch_pattern="$2"
            local label="$3"
            if [ ! -f "$path" ]; then
              echo "MISSING [$label]: $path"
              FAIL=1
              return
            fi
            local info
            info=$(file -b "$path")
            if echo "$info" | grep -qE "$arch_pattern"; then
              echo "OK [$label]: $path"
            else
              echo "WRONG ARCH [$label]: $path"
              echo "  Expected pattern: $arch_pattern"
              echo "  Got: $info"
              FAIL=1
            fi
          }

          # Linux arm64
          check_file "$BASE/linux-arm64/libfastcdr.so.2.3.0"      "aarch64"  "linux-arm64"
          check_file "$BASE/linux-arm64/libfastdds.so.3.2.2"      "aarch64"  "linux-arm64"
          check_file "$BASE/linux-arm64/libjnifastddsjava.so"      "aarch64"  "linux-arm64"

          # Linux armhf (32-bit ARM, EABI5)
          check_file "$BASE/linux-armhf/libfastcdr.so.2.3.0"      "EABI5"    "linux-armhf"
          check_file "$BASE/linux-armhf/libfastdds.so.3.2.2"      "EABI5"    "linux-armhf"
          check_file "$BASE/linux-armhf/libjnifastddsjava.so"      "EABI5"    "linux-armhf"

          # Linux x86_64
          check_file "$BASE/linux-x86_64/libfastcdr.so.2.3.0"     "x86-64"   "linux-x86_64"
          check_file "$BASE/linux-x86_64/libfastdds.so.3.2.2"     "x86-64"   "linux-x86_64"
          check_file "$BASE/linux-x86_64/libjnifastddsjava.so"     "x86-64"   "linux-x86_64"

          # Windows x86_64
          check_file "$BASE/windows-x86_64/fastcdr-2.3.dll"        "x86-64"   "windows-x86_64"
          check_file "$BASE/windows-x86_64/fastdds-3.2.dll"        "x86-64"   "windows-x86_64"
          check_file "$BASE/windows-x86_64/jnifastddsjava.dll"     "x86-64"   "windows-x86_64"

          # macOS arm64
          check_file "$BASE/macos-arm64/libfastcdr.2.3.0.dylib"    "arm64"    "macos-arm64"
          check_file "$BASE/macos-arm64/libfastdds.3.2.2.dylib"    "arm64"    "macos-arm64"
          check_file "$BASE/macos-arm64/libjnifastddsjava.dylib"   "arm64"    "macos-arm64"

          # macOS x86_64
          check_file "$BASE/macos-x86_64/libfastcdr.2.3.0.dylib"  "x86_64"   "macos-x86_64"
          check_file "$BASE/macos-x86_64/libfastdds.3.2.2.dylib"  "x86_64"   "macos-x86_64"
          check_file "$BASE/macos-x86_64/libjnifastddsjava.dylib"  "x86_64"   "macos-x86_64"

          # Android arm64-v8a
          check_file "$ANDROID_BASE/arm64-v8a/libfastcdr.so"       "aarch64"  "android-arm64-v8a"
          check_file "$ANDROID_BASE/arm64-v8a/libfastdds.so"       "aarch64"  "android-arm64-v8a"
          check_file "$ANDROID_BASE/arm64-v8a/libjnifastddsjava.so" "aarch64" "android-arm64-v8a"

          # Android x86_64
          check_file "$ANDROID_BASE/x86_64/libfastcdr.so"          "x86-64"   "android-x86_64"
          check_file "$ANDROID_BASE/x86_64/libfastdds.so"          "x86-64"   "android-x86_64"
          check_file "$ANDROID_BASE/x86_64/libjnifastddsjava.so"   "x86-64"   "android-x86_64"

          if [ $FAIL -ne 0 ]; then
            echo ""
            echo "One or more native libraries are missing or have the wrong architecture. Aborting."
            exit 1
          fi
          echo ""
          echo "All native libraries verified."

      - name: Show what files changed
        run: |
          echo "Git status after copying artifacts:"
          git status --short

      - name: Commit all native libraries
        run: |
          git config user.name "ihmc-rosie"
          git config user.email "rosie@ihmc.us"
          git add src/main/resources/fastddsjava/native android/src/main/jniLibs
          if git diff --staged --quiet; then
            echo "No native library changes to commit."
            exit 0
          fi
          git commit -m "Rebuild all native libraries"
          git push
