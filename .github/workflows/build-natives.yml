name: Build natives

on:
  workflow_dispatch:

jobs:
  build-natives-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [arm64, armhf, x86_64]
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential crossbuild-essential-arm64 crossbuild-essential-armhf git curl wget unzip openjdk-17-jdk
          # Install newer version of cmake
          wget https://github.com/Kitware/CMake/releases/download/v4.0.2/cmake-4.0.2-linux-x86_64.tar.gz
          tar -xzvf cmake-4.0.2-linux-x86_64.tar.gz
          sudo mv cmake-4.0.2-linux-x86_64 /opt/cmake-4.0.2
          rm -rf cmake-4.0.2-linux-x86_64.tar.gz

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile native library (arm64)
        if: matrix.platform == 'arm64'
        run: |
          PATH=/opt/cmake-4.0.2/bin:$PATH bash build-linux-arm64.bash

      - name: Compile native library (armhf)
        if: matrix.platform == 'armhf'
        run: |
          PATH=/opt/cmake-4.0.2/bin:$PATH bash build-linux-armhf.bash

      - name: Compile native library (x86_64)
        if: matrix.platform == 'x86_64'
        run: |
          PATH=/opt/cmake-4.0.2/bin:$PATH bash build-linux-x86_64.bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natives-linux-${{ matrix.platform }}
          path: |
            src/main/resources/**/*.so
            src/main/resources/**/*.so.*
          retention-days: 1
  build-natives-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile native library
        run: |
          bash.exe cppbuild.bash
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natives-windows
          path: src/main/resources/**/*.dll
          retention-days: 1
  build-natives-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        platform: [arm64-v8a, x86_64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential git curl wget unzip openjdk-17-jdk
          # Install newer version of cmake
          wget https://github.com/Kitware/CMake/releases/download/v4.0.2/cmake-4.0.2-linux-x86_64.tar.gz
          tar -xzvf cmake-4.0.2-linux-x86_64.tar.gz
          sudo mv cmake-4.0.2-linux-x86_64 /opt/cmake-4.0.2
          rm -rf cmake-4.0.2-linux-x86_64.tar.gz

      - name: Setup Android NDK
        run: |
          # Download and install Android NDK r27c (latest stable available for direct download)
          wget https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          sudo mv android-ndk-r27c /opt/android-ndk
          echo "ANDROID_NDK=/opt/android-ndk" >> $GITHUB_ENV

      - name: Compile native library (arm64-v8a)
        if: matrix.platform == 'arm64-v8a'
        run: |
          PATH=/opt/cmake-4.0.2/bin:$PATH bash build-android-arm64.bash

      - name: Compile native library (x86_64)
        if: matrix.platform == 'x86_64'
        run: |
          PATH=/opt/cmake-4.0.2/bin:$PATH bash build-android-x86_64.bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natives-android-${{ matrix.platform }}
          path: android/src/main/jniLibs/**/*.so
          retention-days: 1

  build-natives-macos-arm:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile native library (arm64)
        run: |
          MAC_COMPILE_ARM64=1 bash cppbuild.bash
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natives-macos-arm64
          path: src/main/resources/**/*.dylib
          retention-days: 1

  build-natives-macos-intel:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Compile native library (x86_64)
        run: |
          bash cppbuild.bash
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natives-macos-x86_64
          path: src/main/resources/**/*.dylib
          retention-days: 1

  commit-all-natives:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [build-natives-linux, build-natives-windows, build-natives-android, build-natives-macos-arm, build-natives-macos-intel]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "Listing artifacts directory structure:"
          find artifacts -type f

      - name: Copy artifacts to repository
        run: |
          # Copy Linux natives (preserving directory structure)
          if [ -d "artifacts/natives-linux-arm64" ]; then
            cp -rv artifacts/natives-linux-arm64/* .
          fi
          if [ -d "artifacts/natives-linux-armhf" ]; then
            cp -rv artifacts/natives-linux-armhf/* .
          fi
          if [ -d "artifacts/natives-linux-x86_64" ]; then
            cp -rv artifacts/natives-linux-x86_64/* .
          fi

          # Copy Windows natives
          if [ -d "artifacts/natives-windows" ]; then
            cp -rv artifacts/natives-windows/* .
          fi

          # Copy Android natives
          if [ -d "artifacts/natives-android-arm64-v8a" ]; then
            cp -rv artifacts/natives-android-arm64-v8a/* .
          fi
          if [ -d "artifacts/natives-android-x86_64" ]; then
            cp -rv artifacts/natives-android-x86_64/* .
          fi

          # Copy macOS natives
          if [ -d "artifacts/natives-macos-arm64" ]; then
            cp -rv artifacts/natives-macos-arm64/* .
          fi
          if [ -d "artifacts/natives-macos-x86_64" ]; then
            cp -rv artifacts/natives-macos-x86_64/* .
          fi

      - name: Show what files changed
        run: |
          echo "Git status after copying artifacts:"
          git status

      - name: Commit all native libraries
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            src/main/resources/**/*.so
            src/main/resources/**/*.so.*
            src/main/resources/**/*.dll
            src/main/resources/**/*.dylib
            android/src/main/jniLibs/**/*.so
          author_name: ihmc-rosie
          author_email: rosie@ihmc.us
          message: 'Rebuild all native libraries'
          push: true
