name: Gradle test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 */8 * * *'

jobs:
  gradle-test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ros_distro: [humble, jazzy, kilted]
    container:
      image: osrf/ros:${{ matrix.ros_distro }}-desktop
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y wget curl unzip

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run JUnit tests
        run: ROS_DISTRO=${{ matrix.ros_distro }} ./gradlew test

      - name: Run JUnit tests (Gradle plugin)
        run: cd buildSrc && ../gradlew test

      - name: Print any error report files
        if: always()
        run: find . -name 'hs_err*' -type f -exec cat {} +
  gradle-test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run JUnit tests
        run: ./gradlew test

      - name: Run JUnit tests (Gradle plugin)
        run: ../gradlew test
