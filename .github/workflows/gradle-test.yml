name: Test

on:
  workflow_dispatch:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  test-linux:
    name: Linux (ROS 2 ${{ matrix.ros_distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        ros_distro: [humble, jazzy, kilted]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Run tests
        run: ROS_DISTRO=${{ matrix.ros_distro }} ./gradlew test

      - name: Print error logs
        if: failure()
        run: find . -name 'hs_err*' -type f -exec cat {} +

  test-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests
        shell: bash
        run: ./gradlew test

  test-macos-intel:
    name: macOS (Intel)
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests
        run: ./gradlew test

  test-macos-arm:
    name: macOS (ARM)
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run tests
        run: ./gradlew test
